name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[dev,notebook,quantum]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Type-check
        run: mypy src
      - name: Test with coverage
        run: pytest --cov=qheart --cov-report=term-missing --cov-report=xml
      - name: Validate public evidence
        run: python scripts/validate_public_artifact.py artifacts/public/results.json
      - name: Rebuild and execute notebook
        run: python scripts/build_notebook.py --execute
      - name: Quantum smoke test
        run: pytest tests/test_qiskit_integration.py -q
