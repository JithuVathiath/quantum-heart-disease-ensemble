name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e '.[dev,quantum]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Type-check
        run: mypy src
      - name: Test with coverage
        run: pytest --cov=qheart --cov-report=term-missing --cov-report=xml
      - name: Validate public evidence
        run: python scripts/validate_public_artifact.py artifacts/public/results.json apps/explorer/public/results.json
      - name: Quantum smoke test
        run: pytest tests/test_qiskit_integration.py -q

  evidence-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/explorer/pnpm-lock.yaml
      - name: Install explorer dependencies
        working-directory: apps/explorer
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        working-directory: apps/explorer
        run: pnpm test
      - name: Production build
        working-directory: apps/explorer
        run: pnpm build
      - name: Install Chromium
        working-directory: apps/explorer
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/explorer
        run: pnpm test:e2e

